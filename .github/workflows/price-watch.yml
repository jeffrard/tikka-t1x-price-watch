name: Tikka price watch

on:
  schedule:
    # Every 30 minutes (UTC). GitHub may delay scheduled runs by a few minutes.
    # Free on public repos. On a private repo, use "7 * * * *" (hourly) instead.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force_digest:
        description: "Send the daily summary notification right now"
        type: boolean
        default: false

permissions:
  contents: write   # lets the run save state.json back to the repo

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_DIGEST: ${{ inputs.force_digest && '1' || '' }}
        run: python price_watch.py

      - name: Save state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "price-watch-bot"
            git config user.email "price-watch-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update price-watch state [skip ci]"
            git push
          fi
